<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Editează Produs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h1 class="mb-4">Editează produsul: {{ product.title }}</h1>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Denumire produs:</label>
                <input type="text" name="title" class="form-control" value="{{ product.title }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preț:</label>
                <input type="text" name="price" class="form-control" value="{{ product.price }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descriere produs:</label>
                <textarea name="description" class="form-control" rows="4" required>{{ product.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">URL Poza (Imagine):</label>
                <input type="text" name="image_url" class="form-control" value="{{ product.image_url }}">
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">Salvează modificările</button>
                <a href="/products" class="btn btn-secondary">Anulează</a>
            </div>
        </form>
    </div>
</body>
</html>
