<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prelucrare Factură PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


    <div class="container">
        <p><a href="{{ url_for('home.index') }}">&larr; Înapoi la meniu</a></p>
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
            <h2 class="mb-3 text-primary">#2. Prelucrare Factură PDF</h2>
            <p class="text-muted">Încarcă factura în format PDF .</p>
            
            <hr>

            <form method="POST" enctype="multipart/form-data" class="mt-4">
                <div class="mb-4">
                    <label for="formFile" class="form-label fw-bold">Selectează fișierul PDF din calculator:</label>
                    <input class="form-control" type="file" id="formFile" name="file" accept=".pdf" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                    Transformă în CSV și descarcă
                </button>
            </form>
        </div>
    </div>

    <footer class="text-center mt-5 text-muted small">
        Proba Practică - Problema #2
    </footer>

</body>
</html>
