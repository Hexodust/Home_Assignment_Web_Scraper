services:
  web:
    build:
      context: .
      cache_from:
        - home_assignment_web_scraper-web:latest
    image: home_assignment_web_scraper-web:latest
    ports:
      - "16000:16000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=${FLASK_ENV:-production}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    image: postgres:15.2-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flask_dev
      POSTGRES_USER: flask
      POSTGRES_PASSWORD: flask
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flask -d flask_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data: